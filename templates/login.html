<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 · IT자산 매입 플랫폼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <style>
    :root { --lg: #A50034; --lg-dark: #8A002C; --ink: #1A1A1A; --ink-2: #6B6B6B; --line: #E4E4E4; }
    * { box-sizing: border-box; }
    body {
      background: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Pretendard','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      color: var(--ink);
    }
    body::before {
      content: ''; position: fixed; left: 0; top: 0; right: 0; height: 4px;
      background: var(--lg); z-index: 2;
    }

    .login-wrap { width: 100%; max-width: 400px; padding: 24px; }

    .brand-header { margin-bottom: 28px; }
    .brand-header .kicker {
      font-size: 11px; font-weight: 800; letter-spacing: .16em;
      color: var(--lg); text-transform: uppercase; margin-bottom: 8px;
    }
    .brand-header h1 {
      font-size: 24px; font-weight: 800; letter-spacing: -.02em;
      color: var(--ink); margin: 0;
    }
    .brand-header p { font-size: 13px; color: var(--ink-2); margin: 6px 0 0; }

    .login-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 32px 32px 28px;
    }

    .form-label { font-size: 12px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
    .input-group-text { background: #F4F4F4; border-color: var(--line); color: var(--ink-2); border-radius: 0; }
    .form-control, .form-select {
      font-size: 14px; padding: 11px 14px; border-radius: 0; border-color: var(--line);
    }
    .form-control:focus, .form-select:focus { border-color: var(--lg); box-shadow: 0 0 0 3px rgba(165,0,52,.12); }

    .btn-login {
      background: var(--lg); color: #fff; border: none; border-radius: 0;
      width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
      transition: background .15s;
    }
    .btn-login:hover { background: var(--lg-dark); color: #fff; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0 12px; color: #B0B0B0; font-size: 11px; letter-spacing: .1em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .footer-links {
      margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .footer-links a {
      color: var(--ink-2); font-size: 12px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line); padding: 8px 16px; border-radius: 0;
      background: #fff; transition: all .15s;
    }
    .footer-links a:hover { border-color: var(--ink); color: var(--ink); }
    .footer-copy { margin-top: 16px; font-size: 11px; color: #9A9A9A; }
    .footer-copy span { color: var(--ink-2); font-weight: 700; }
  </style>
</head>
<body>
<div class="login-wrap">

  <!-- 브랜드 헤더 -->
  <div class="brand-header">
    <div class="kicker">IT Asset Buyback</div>
    <h1>IT자산 매입 플랫폼</h1>
    <p>고객사 보유 IT자산 매입 · 구매지원금 정산</p>
  </div>

  <!-- 로그인 카드 -->
  <div class="login-card">
    {% if error %}
    <div class="d-flex align-items-center gap-2 py-2 px-3 mb-4"
         style="font-size:13px;background:#FBEEF2;border:1px solid #EAD3DB;color:#A50034">
      <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3" id="dealerField">
        <label class="form-label">대리점</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shop"></i></span>
          <select name="branch_code" class="form-control" id="dealerSelect" required>
            <option value="" selected disabled>대리점을 선택하세요</option>
            {% for d in dealers %}
            <option value="{{ d.branch_code }}">{{ d.branch_name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3 d-none" id="codeField">
        <label class="form-label">아이디</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
          <input type="text" name="branch_code" class="form-control" id="codeInput"
                 placeholder="아이디를 입력하세요" disabled/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="비밀번호를 입력하세요" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>로그인
      </button>
    </form>

    <div class="divider">ACCESS</div>
    <div class="text-center">
      <a href="#" id="adminToggle" style="font-size:12px;color:var(--ink-2);text-decoration:none">
        <i class="bi bi-person-gear"></i> 관리자 로그인
      </a>
    </div>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('adminToggle');
      var dealerField = document.getElementById('dealerField');
      var codeField = document.getElementById('codeField');
      var dealerSelect = document.getElementById('dealerSelect');
      var codeInput = document.getElementById('codeInput');
      var admin = false;
      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        admin = !admin;
        dealerField.classList.toggle('d-none', admin);
        codeField.classList.toggle('d-none', !admin);
        dealerSelect.disabled = admin;
        codeInput.disabled = !admin;
        toggle.innerHTML = admin
          ? '<i class="bi bi-shop"></i> 대리점 로그인'
          : '<i class="bi bi-person-gear"></i> 관리자 로그인';
        (admin ? codeInput : dealerSelect).focus();
      });
    })();
  </script>

  <!-- 하단 링크 -->
  <div class="footer-links">
    <a href="/process">
      <i class="bi bi-play-circle"></i> 플랫폼 업무 프로세스 소개
    </a>
    <a href="/pricing-standard">
      <i class="bi bi-tag"></i> 가격 산정 기준 안내
    </a>
  </div>
  <div class="footer-copy">
    운영 <span>월드와이드메모리</span>
  </div>
</div>
</body>
</html>
